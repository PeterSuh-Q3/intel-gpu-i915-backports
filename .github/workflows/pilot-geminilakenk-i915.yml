name: "[PILOT] geminilakenk i915 (ONLY_I915 / no dmabuf)"

# geminilakenk DSM stock 커널은 DRM=m, DRM_I915=m, dma-buf 빌트인이라
# backport dmabuf.ko 가 dma_fence tracepoint(__SCK__tp_func_dma_fence_signaled)를
# 커널과 중복 export → 적재 거부 → i915 Exec format error.
# defconfig-i915 (CPTCFG_ONLY_I915=y) 는 dmabuf.ko 를 만들지 않고 커널 빌트인 dma-buf 를 쓴다.
# 본 파일럿은 geminilakenk 7.3 만 defconfig-i915 로 빌드하여 산출 .ko 목록과
# modpost 경고(stock drm/i915 심볼 충돌 여부)를 확인한다.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.3", platform: geminilakenk }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: "[DEBUG] Host kernel stock DRM/i915/dma-buf"
        run: |
          KCONFIG=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build/.config
          echo "=== stock drm/i915/dma-buf in host .config ==="
          grep -E "^CONFIG_DRM=|^CONFIG_DRM_I915=|^CONFIG_DMA_SHARED_BUFFER=|^# CONFIG_DMA_SHARED_BUFFER" "$KCONFIG" || echo "[INFO] none"
          echo ""
          echo "=== dma_fence / dma_buf symbols in host Module.symvers ==="
          SYMV=$(dirname "$KCONFIG")/Module.symvers
          if [[ -f "$SYMV" ]]; then
            grep -E "dma_fence_signaled|__SCK__tp_func_dma_fence|dma_buf_attach|drm_dev_alloc|drm_gem_object_init" "$SYMV" || echo "[INFO] no matching symbols exported by host kernel"
          else
            echo "[WARN] Module.symvers not found: $SYMV"
          fi

      - name: Build (defconfig-drm + dmabuf 제외 주입)
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1   # 런타임 제공 심볼(i2c_bit_algo 등) 경고 처리

          # 9개 세트와 동일하게 defconfig-drm 으로 구성(MEI/PMT 등은 꺼진 상태 유지)
          make defconfig-drm

          # geminilakenk 만: dmabuf.ko 제외.
          # dmabuf.o 빌드 트리거는 choice(BUILD_DMABUF_I915_MEI | ONLY_DMABUF | ONLY_I915).
          # BUILD_DMABUF_I915_MEI=y → ONLY_I915=y 로 전환하면 dmabuf 미빌드 + i915 는 커널 빌트인 dma-buf 사용.
          echo "[INJECT] dmabuf 제외: BUILD_DMABUF_I915_MEI → ONLY_I915"
          sed -i 's/^CPTCFG_BUILD_DMABUF_I915_MEI=y/# CPTCFG_BUILD_DMABUF_I915_MEI is not set/' .config
          if grep -q '^CPTCFG_ONLY_I915' .config; then
            sed -i 's/^# CPTCFG_ONLY_I915 is not set/CPTCFG_ONLY_I915=y/; s/^CPTCFG_ONLY_I915=.*/CPTCFG_ONLY_I915=y/' .config
          else
            echo 'CPTCFG_ONLY_I915=y' >> .config
          fi
          make olddefconfig   # choice 정합화

          echo "=== CPTCFG key switches after inject ==="
          grep -E "^CPTCFG_(ONLY_I915|ONLY_DMABUF|BUILD_DMABUF_I915_MEI|DRM|DRM_I915|INTEL_GTT|I915_NO_DRM|INTEL_MEI|INTEL_PMT)" .config \
            || echo "[WARN] expected CPTCFG switches not found"

          make -j$(nproc) modules_copy
          mkdir -p out/modules
          cp -vf .config out/modules/

          echo "=== built .ko list ==="
          ls -la out/modules/*.ko || echo "[WARN] no .ko produced"

      - name: Pack modules and config
        working-directory: out
        run: zip -r pilot_i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pilot_i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/pilot_i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip
