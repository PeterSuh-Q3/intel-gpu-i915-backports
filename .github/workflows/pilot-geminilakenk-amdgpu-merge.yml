name: "[PILOT-AMD-MERGE] geminilakenk i915+amdgpu (feature/amdgpu-merge)"

# i915(MT65 v6.5) + amdgpu(DSM 5.10.55) 병합 빌드 파일럿.
# dsm_linux-gemini 의 amdgpu 소스트리를 i915-backports 에 통합한 브랜치에서 빌드.
# DRM_AMD_DC=n, HSA_AMD=n, DRM_AMDGPU_SI=n, DRM_AMDGPU_CIK=n.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.3", platform: geminilakenk }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (feature/amdgpu-merge)
        uses: actions/checkout@v4
        with:
          ref: feature/amdgpu-merge
          fetch-depth: 1

      - name: Cache toolkit tarballs
        uses: actions/cache@v4
        with:
          path: |
            ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
            ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          key: toolkit-${{ matrix.platform }}-${{ matrix.version }}

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          if [ -f "$env_tarball" ]; then echo "[cache] $env_tarball"; else
            echo "[download] $env_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          fi
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          if [ -f "$dev_tarball" ]; then echo "[cache] $dev_tarball"; else
            echo "[download] $dev_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          fi
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: Build (i915+amdgpu merge)
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1

          echo "[PATCH] drop EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled)"
          sed -i '/^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);/d' drivers/dma-buf/dma-fence.c
          grep -q "^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);" drivers/dma-buf/dma-fence.c \
            && { echo "[WARN] 제거 실패"; exit 1; } || echo "[OK]"

          echo "[PATCH] drop EXPORT_SYMBOL(intel_gmch_probe/remove)"
          sed -i '/^EXPORT_SYMBOL(intel_gmch_probe);/d; /^EXPORT_SYMBOL(intel_gmch_remove);/d' \
            drivers/char/agp/intel-gtt.c
          grep -qE "^EXPORT_SYMBOL\(intel_gmch_(probe|remove)\);" drivers/char/agp/intel-gtt.c \
            && { echo "[WARN] intel_gmch 제거 실패"; exit 1; } || echo "[OK]"

          make defconfig-drm
          echo "=== CPTCFG (i915 + amdgpu 활성 확인) ==="
          grep -E "^CPTCFG_(DRM=|DRM_I915=|DRM_TTM|DRM_SCHED|DRM_AMDGPU)" .config || echo "(해당 없음)"

          make -j$(nproc) 2>&1 | tee /tmp/build.log || true
          echo "=== 빌드 로그 마지막 100줄 ==="
          tail -100 /tmp/build.log

          MODULES_INTERMEDIATES=$PWD/out/intermediates
          OUT_MODULES=$PWD/out/modules
          mkdir -p $OUT_MODULES

          make -C $KLIB_BUILD M=$PWD \
            INSTALL_MOD_PATH=$MODULES_INTERMEDIATES \
            CONFIG_MODULE_SIG_ALL= \
            _emodinst_ 2>&1 | tail -20 || true

          find $MODULES_INTERMEDIATES -type f -name '*.ko' -exec mv {} $OUT_MODULES \; 2>/dev/null || true
          cp -vf .config out/modules/ 2>/dev/null || true

          # drm_mipi_dsi.ko: 고아모듈 제외
          rm -fv "$OUT_MODULES/drm_mipi_dsi.ko" 2>/dev/null || true

          echo "=== 산출 .ko 목록 ==="
          ls -1 out/modules/*.ko 2>/dev/null | xargs -n1 basename || echo "(모듈 없음)"
          echo "=== 빌드 오류 요약 ==="
          grep -c "error:" /tmp/build.log || true
          echo "개 컴파일 에러"

      - name: "[VERIFY] 충돌 심볼 사전 점검"
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          SYMV="$KLIB_BUILD/Module.symvers"
          if [[ ! -f "$SYMV" ]]; then echo "[WARN] host Module.symvers 없음"; exit 0; fi

          echo "=== 신형 모듈 export ∩ host 커널 Module.symvers ==="
          awk '{print $2}' "$SYMV" | sort -u > /tmp/host_syms.txt
          total=0
          for ko in out/modules/*.ko; do
            [[ -f "$ko" ]] || continue
            name=$(basename "$ko")
            nm "$ko" 2>/dev/null | grep -oE '__ksymtab_[A-Za-z0-9_]+' | sed 's/__ksymtab_//' | sort -u > /tmp/ko_exp.txt
            dup=$(comm -12 /tmp/ko_exp.txt /tmp/host_syms.txt)
            if [[ -n "$dup" ]]; then
              cnt=$(echo "$dup" | grep -c .)
              echo "  [DUP] $name : $cnt 개 중복 export"
              echo "$dup" | sed 's/^/        /'
              total=$((total+cnt))
            fi
          done
          echo "=== 중복 export 총계: ${total} ==="

      - name: Save build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_amdgpu_merge_${{ matrix.version }}_${{ matrix.platform }}
          path: |
            /tmp/build.log
            out/modules/

      - name: Pack (if modules exist)
        run: |
          if ls out/modules/*.ko 1>/dev/null 2>&1; then
            cd out && zip -r pilot_amdgpu_merge_${{ matrix.version }}_${{ matrix.platform }}.zip modules
            echo "[OK] zip 생성"
          else
            echo "[INFO] .ko 없음 — zip 생략"
          fi

      - name: Save artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot_amdgpu_merge_${{ matrix.version }}_${{ matrix.platform }}
          path: out/
