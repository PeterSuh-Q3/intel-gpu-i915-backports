name: "[2차] Build i915 (MT_65 v6.5 base) + copy to mshell-modules"

# build-all-n-copy.yml 과 동일하되, 소스를 MT_65 신형 베이스(mainline-tracking-v6.5)로
# 체크아웃하여 빌드한다(B 방법). 워크플로우 정의는 redhat/main-epyc7002 에서 읽지만
# 워킹트리(빌드 소스)는 mainline-tracking-v6.5 전체 → i915 + ttm + drm_buddy + drm_display_helper.
# thirdparty 경로는 1차와 동일(platform-DSM-KVER) — overwrite 가 의도된 동작.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.1", platform: epyc7002 }
          - { version: "7.2", platform: epyc7002 }
          - { version: "7.2", platform: geminilakenk }
          - { version: "7.2", platform: r1000nk }
          - { version: "7.2", platform: v1000nk }
          - { version: "7.3", platform: epyc7002 }
          - { version: "7.3", platform: geminilakenk }
          - { version: "7.3", platform: r1000nk }
          - { version: "7.3", platform: v1000nk }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (MT_65 v6.5 base source)
        uses: actions/checkout@v4
        with:
          ref: mainline-tracking-v6.5
          fetch-depth: 1

      # toolkit tarball(env/dev .txz) 캐시 — 반복 run 에서 synologydownload 재다운로드 회피.
      - name: Cache toolkit tarballs
        uses: actions/cache@v4
        with:
          path: |
            ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
            ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          key: toolkit-${{ matrix.platform }}-${{ matrix.version }}

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          if [ -f "$env_tarball" ]; then echo "[cache] $env_tarball 존재 → wget 생략"; else echo "[download] $env_tarball"; wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball; fi
          mkdir toolchain
          echo "[extract] tar 해제 시작 $(date +%T)"; tar xf $env_tarball -C toolchain; echo "[extract] tar 해제 완료 $(date +%T)"

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          if [ -f "$dev_tarball" ]; then echo "[cache] $dev_tarball 존재 → wget 생략"; else echo "[download] $dev_tarball"; wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball; fi
          mkdir ksrc
          echo "[extract] tar 해제 시작 $(date +%T)"; tar xf $dev_tarball -C ksrc; echo "[extract] tar 해제 완료 $(date +%T)"

      - name: "[DEBUG] Host kernel CONFIG_DRM check"
        run: |
          KCONFIG=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build/.config
          echo "=== Host kernel config path ==="
          ls -la "$KCONFIG" || echo "[WARN] .config not found at expected path"

          echo ""
          echo "=== DRM-related symbols in host kernel ==="
          if [[ -f "$KCONFIG" ]]; then
            grep -E "CONFIG_DRM|CONFIG_AGP|CONFIG_FB" "$KCONFIG" || echo "[INFO] No DRM symbols found"
          fi

          echo ""
          echo "=== backport DRM/i915 dependency symbols in host kernel ==="
          if [[ -f "$KCONFIG" ]]; then
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              echo "  $(grep -E "^${s}=|^# ${s} is not set" "$KCONFIG" 2>/dev/null || echo "${s} -> (absent)")"
            done
          fi

      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-

          # r1000nk / v1000nk: host .config 에 backport DRM/i915 의존 심볼 주입
          # (CPTCFG_DRM_I915 가시성은 host .config depends 가 결정 → 누락 시 i915 미빌드)
          if [[ "${{ matrix.platform }}" == "r1000nk" || "${{ matrix.platform }}" == "v1000nk" ]]; then
            HOSTCFG="$KLIB_BUILD/.config"
            echo "[INJECT] backport DRM/i915 deps into host config: $HOSTCFG"
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              if grep -q "^# ${s} is not set" "$HOSTCFG" 2>/dev/null; then
                sed -i "s/^# ${s} is not set/${s}=y/" "$HOSTCFG"
                echo "  [ENABLED] ${s}=y"
              elif ! grep -q "^${s}=" "$HOSTCFG" 2>/dev/null; then
                echo "${s}=y" >> "$HOSTCFG"
                echo "  [ADDED]   ${s}=y"
              else
                echo "  [OK]      $(grep "^${s}=" "$HOSTCFG")"
              fi
            done
            export KBUILD_MODPOST_WARN=1   # i2c_bit_algo 등 런타임 제공 심볼 경고 처리
          fi

          # ── geminilakenk: dma_fence_signaled tracepoint export 제거 ──
          # MT_65 베이스 dma-fence.c 에도 EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled) 존재(확인됨).
          # geminilakenk DSM 커널은 dma-buf 빌트인 → 중복 export 충돌 → i915 적재 실패 방지.
          # epyc7002/r1000nk/v1000nk 는 dma-buf absent 라 제거 금지.
          if [[ "${{ matrix.platform }}" == "geminilakenk" ]]; then
            echo "[PATCH] geminilakenk: drop EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled)"
            sed -i '/^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);/d' drivers/dma-buf/dma-fence.c
            if grep -q "^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);" drivers/dma-buf/dma-fence.c; then
              echo "[WARN] 제거 실패 — 라인 패턴 확인 필요"; exit 1
            else
              echo "[OK] EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled) 제거됨"
            fi

            # intel_gmch_probe/remove EXPORT 제거: geminilakenk 커널이 intel-gtt 를 빌트인(vmlinux)으로
            # export → 우리 intel-gtt.ko 와 중복 → i915 의존 적재 차단. EXPORT 만 제거(intel-gtt.ko 는
            # 나머지 intel_gmch_* 6개 제공 위해 유지). i915 는 이 2개를 커널 빌트인에서 가져옴.
            echo "[PATCH] geminilakenk: drop EXPORT_SYMBOL(intel_gmch_probe/remove)"
            sed -i '/^EXPORT_SYMBOL(intel_gmch_probe);/d; /^EXPORT_SYMBOL(intel_gmch_remove);/d' drivers/char/agp/intel-gtt.c
            if grep -qE "^EXPORT_SYMBOL\(intel_gmch_(probe|remove)\);" drivers/char/agp/intel-gtt.c; then
              echo "[WARN] intel_gmch EXPORT 제거 실패"; exit 1
            else
              echo "[OK] intel_gmch_probe/remove EXPORT 제거됨"
            fi
          fi

          make defconfig-drm

          echo "=== CPTCFG_DRM* after defconfig-drm ==="
          grep -E "^CPTCFG_(DRM|DRM_I915|INTEL_GTT|DRM_KMS_HELPER|DRM_MIPI_DSI|DRM_TTM|DRM_BUDDY)=" .config \
            || echo "[WARN] CPTCFG_DRM* not enabled — i915 will be skipped"

          # MT_65 표준 빌드(modules_copy 타겟 없음). 배포용이므로 INSTALL_MOD_STRIP=1 로 strip.
          make -j$(nproc)
          MODULES_INTERMEDIATES=$PWD/out/intermediates
          OUT_MODULES=$PWD/out/modules
          mkdir -p $OUT_MODULES
          make -C $KLIB_BUILD M=$PWD \
            INSTALL_MOD_PATH=$MODULES_INTERMEDIATES \
            INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL= \
            _emodinst_
          find $MODULES_INTERMEDIATES -type f -name '*.ko' -exec mv {} $OUT_MODULES \;
          cp -vf .config out/modules/

          # geminilakenk: drm_mipi_dsi.ko 는 i915 스택이 의존 안 하는 고아 모듈인데 mipi_dsi_* 39개가
          # 커널 빌트인과 충돌 → 산출에서 제외(RR 도 미포함). 다른 플랫폼은 유지.
          if [[ "${{ matrix.platform }}" == "geminilakenk" ]]; then
            rm -fv "$OUT_MODULES/drm_mipi_dsi.ko"
          fi

          echo "=== 산출 .ko (strip됨, ttm/drm_buddy/drm_display_helper 포함 기대) ==="
          ls -l out/modules/*.ko | awk '{print $5, $NF}'

          # thirdparty 경로(platform-DSM-KVER) 구성을 위해 host 커널 release 기록
          KVER=$(sed 's/[+-].*//' "$KLIB_BUILD/include/config/kernel.release" 2>/dev/null)
          [ -z "$KVER" ] && KVER=5.10.55
          echo "$KVER" > out/modules/.kver
          echo "[KVER] ${{ matrix.platform }}-${{ matrix.version }}-${KVER}"

      - name: Pack modules and config
        working-directory: out
        run: zip -r i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip

  # ── 빌드 산출물을 비공개 repo mshell-modules 의 thirdparty/ 로 복사·커밋 ──
  copy-to-mshell:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT (fork 환경 가드)
        id: pat
        run: |
          if [ -n "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PERSONAL_ACCESS_TOKEN 미설정 → mshell-modules 동기화 스킵 (fork 환경: 빌드 산출물만 artifact 로 제공)"
          fi

      - name: Checkout mshell-modules
        if: steps.pat.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mshell-modules
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: mshell-modules

      - name: Download all build artifacts
        if: steps.pat.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy modules into thirdparty/<platform>-<DSM>-<KVER>/
        if: steps.pat.outputs.present == 'true'
        run: |
          shopt -s nullglob
          copied=0
          for d in artifacts/i915_dsm-*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")                                  # i915_dsm-7.3_epyc7002
            ver=$(echo "$base"  | sed -E 's/^i915_dsm-([0-9.]+)_.*/\1/')
            plat=$(echo "$base" | sed -E 's/^i915_dsm-[0-9.]+_(.*)/\1/')
            zip=$(ls "$d"/*.zip 2>/dev/null | head -1)
            [ -n "$zip" ] || { echo "[skip] no zip in $d"; continue; }
            rm -rf "$d/x"; mkdir -p "$d/x"
            unzip -o "$zip" -d "$d/x" >/dev/null
            kver=$(cat "$d/x/modules/.kver" 2>/dev/null)
            [ -z "$kver" ] && kver=5.10.55
            dest="mshell-modules/thirdparty/${plat}-${ver}-${kver}"
            mkdir -p "$dest"
            cp -vf "$d/x/modules/"*.ko "$dest/"
            n=$(ls "$dest"/*.ko 2>/dev/null | wc -l | tr -d ' ')
            echo "[copied] ${plat}-${ver}-${kver}  (${n} ko)"
            copied=$((copied+1))
          done
          echo "total dirs copied: ${copied}"

      - name: Commit & push to mshell-modules
        if: steps.pat.outputs.present == 'true'
        working-directory: mshell-modules
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thirdparty/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "ci: sync i915 5.10.55 modules (MT_65 v6.5 base) from intel-gpu-i915-backports"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push
          fi
