name: Build i915 for DSM Platforms

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - "*-dsm-*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.1", platform: epyc7002 }
          - { version: "7.2", platform: epyc7002 }
          - { version: "7.2", platform: geminilakenk }
          - { version: "7.2", platform: r1000nk }
          - { version: "7.2", platform: v1000nk }
          - { version: "7.3", platform: epyc7002 }
          - { version: "7.3", platform: geminilakenk }
          - { version: "7.3", platform: r1000nk }
          - { version: "7.3", platform: v1000nk }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      # ── [DEBUG] Check DRM-related symbols in kernel .config ──────────────────
      - name: "[DEBUG] Host kernel CONFIG_DRM check"
        run: |
          KCONFIG=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build/.config
          echo "=== Host kernel config path ==="
          ls -la "$KCONFIG" || echo "[WARN] .config not found at expected path"

          echo ""
          echo "=== DRM-related symbols in host kernel ==="
          if [[ -f "$KCONFIG" ]]; then
            grep -E "CONFIG_DRM|CONFIG_AGP|CONFIG_FB" "$KCONFIG" || echo "[INFO] No DRM symbols found"
          fi

          echo ""
          echo "=== backport DRM/i915 dependency symbols in host kernel ==="
          # Host symbols required by CPTCFG_DRM / CPTCFG_DRM_I915 via Kconfig depends.
          # If missing (# ... is not set), CPTCFG_DRM_I915 becomes invisible and i915 is not built.
          if [[ -f "$KCONFIG" ]]; then
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              echo "  $(grep -E "^${s}=|^# ${s} is not set" "$KCONFIG" 2>/dev/null || echo "${s} → (absent)")"
            done
          fi

      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-

          # ── r1000nk / v1000nk: Injecting backport DRM/i915 dependency symbols into host kernel .config ──
          
          # Root Cause: patch_config.sh fixes the backport .config, but the visibility of CPTCFG_DRM_I915
          # is determined by the depends symbols in the host kernel .config (KLIB_BUILD/.config).
          # If missing in the host, make's kconfig resynchronization makes CPTCFG_DRM_I915 invisible →
          # i915 not built (only dmabuf/compat created). epyc7002/geminilakenk already exists in the host.
          # → Inject dependency symbols into the host .config before running defconfig-drm.          
          
          # 근본원인: patch_config.sh 는 backport .config 를 고치지만, CPTCFG_DRM_I915 의
          # 가시성은 host kernel .config(KLIB_BUILD/.config) 의 depends 심볼이 결정한다.
          # host 에 누락되면 make 의 kconfig 재동기화가 CPTCFG_DRM_I915 를 비가시화 →
          # i915 미빌드(dmabuf/compat 만 생성). epyc7002/geminilakenk host 엔 이미 존재.
          # → defconfig-drm 실행 전에 host .config 에 의존 심볼을 주입한다.
          
          if [[ "${{ matrix.platform }}" == "r1000nk" || "${{ matrix.platform }}" == "v1000nk" ]]; then
            HOSTCFG="$KLIB_BUILD/.config"
            echo "[INJECT] backport DRM/i915 deps into host config: $HOSTCFG"
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              if grep -q "^# ${s} is not set" "$HOSTCFG" 2>/dev/null; then
                sed -i "s/^# ${s} is not set/${s}=y/" "$HOSTCFG"
                echo "  [ENABLED] ${s}=y"
              elif ! grep -q "^${s}=" "$HOSTCFG" 2>/dev/null; then
                echo "${s}=y" >> "$HOSTCFG"
                echo "  [ADDED]   ${s}=y"
              else
                echo "  [OK]      $(grep "^${s}=" "$HOSTCFG")"
              fi
            done
            export KBUILD_MODPOST_WARN=1   # Warning handling for runtime-provided symbols such as i2c_bit_algo
          fi
          # ──────────────────────────────────────────────────────────────

          # ── geminilakenk: dma_fence_signaled tracepoint export 제거 ──
          # geminilakenk DSM 커널은 dma-buf 빌트인이라 __SCK__/__SCT__/__traceiter__/__tracepoint_
          # dma_fence_signaled 를 커널이 이미 export → backport dmabuf.ko 가 같은 tracepoint 를
          # export 하면 "exports duplicate symbol (owned by kernel)" → i915 적재(Exec format error) 실패.
          # CREATE_TRACE_POINTS 정의는 유지하되 EXPORT 만 제거(=__ksymtab 미등록)하여 충돌 회피.
          # epyc7002/r1000nk/v1000nk 는 dma-buf absent 라 커널이 해당 심볼을 제공하지 않으므로 제거 금지.
          if [[ "${{ matrix.platform }}" == "geminilakenk" ]]; then
            echo "[PATCH] geminilakenk: drop EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled)"
            sed -i '/^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);/d' drivers/dma-buf/dma-fence.c
            if grep -q "^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);" drivers/dma-buf/dma-fence.c; then
              echo "[WARN] 제거 실패 — 라인 패턴 확인 필요"; exit 1
            else
              echo "[OK] EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled) 제거됨"
            fi
          fi
          # ──────────────────────────────────────────────────────────────

          make defconfig-drm

          # [VERIFY] Whether i915/DRM is enabled in the defconfig result (must be the same as epyc7002 for normal)
          echo "=== CPTCFG_DRM* after defconfig-drm ==="
          grep -E "^CPTCFG_(DRM|DRM_I915|INTEL_GTT|DRM_KMS_HELPER|DRM_MIPI_DSI)=" .config \
            || echo "[WARN] CPTCFG_DRM* not enabled — i915 will be skipped"

          make -j$(nproc) modules_copy
          mkdir -p out/modules
          cp -vf .config out/modules/
    
      - name: Pack modules and config
        working-directory: out
        run: zip -r i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Append tag to filename
        working-directory: artifacts
        run: |
          find . -name "i915_dsm-*.zip" -print0 | while read -d $'\0' f; do
            mv "$f" "${f%.zip}_${GITHUB_REF##*/}.zip"
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: versions
          files: artifacts/**/i915_dsm-*.zip
