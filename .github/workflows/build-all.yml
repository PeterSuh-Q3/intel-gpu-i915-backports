name: Build i915 for DSM Platforms

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - "*-dsm-*"

jobs:
  build:
    strategy:
      matrix:
        version: [7.3]
        platform: [epyc7002, geminilakenk, r1000nk, v1000nk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      # ── [DEBUG] 커널 .config 에서 DRM 관련 심볼 확인 ──────────────────
      - name: "[DEBUG] Host kernel CONFIG_DRM check"
        run: |
          KCONFIG=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build/.config
          echo "=== Host kernel config path ==="
          ls -la "$KCONFIG" || echo "[WARN] .config not found at expected path"

          echo ""
          echo "=== DRM-related symbols in host kernel ==="
          if [[ -f "$KCONFIG" ]]; then
            grep -E "CONFIG_DRM|CONFIG_AGP|CONFIG_FB" "$KCONFIG" || echo "[INFO] No DRM symbols found"
          fi

          echo ""
          echo "=== backport DRM/i915 dependency symbols in host kernel ==="
          # CPTCFG_DRM / CPTCFG_DRM_I915 가 Kconfig depends 로 요구하는 host 심볼.
          # 누락(# ... is not set)이면 CPTCFG_DRM_I915 가 비가시화되어 i915 미빌드.
          if [[ -f "$KCONFIG" ]]; then
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              echo "  $(grep -E "^${s}=|^# ${s} is not set" "$KCONFIG" 2>/dev/null || echo "${s} → (absent)")"
            done
          fi

      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-

          # ── r1000nk / v1000nk: host kernel .config 에 backport DRM/i915 의존 심볼 주입 ──
          # 근본원인: patch_config.sh 는 backport .config 를 고치지만, CPTCFG_DRM_I915 의
          # 가시성은 host kernel .config(KLIB_BUILD/.config) 의 depends 심볼이 결정한다.
          # host 에 누락되면 make 의 kconfig 재동기화가 CPTCFG_DRM_I915 를 비가시화 →
          # i915 미빌드(dmabuf/compat 만 생성). epyc7002/geminilakenk host 엔 이미 존재.
          # → defconfig-drm 실행 전에 host .config 에 의존 심볼을 주입한다.
          if [[ "${{ matrix.platform }}" == "r1000nk" || "${{ matrix.platform }}" == "v1000nk" ]]; then
            HOSTCFG="$KLIB_BUILD/.config"
            echo "[INJECT] backport DRM/i915 deps into host config: $HOSTCFG"
            for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER \
                     CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY \
                     CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
              if grep -q "^# ${s} is not set" "$HOSTCFG" 2>/dev/null; then
                sed -i "s/^# ${s} is not set/${s}=y/" "$HOSTCFG"
                echo "  [ENABLED] ${s}=y"
              elif ! grep -q "^${s}=" "$HOSTCFG" 2>/dev/null; then
                echo "${s}=y" >> "$HOSTCFG"
                echo "  [ADDED]   ${s}=y"
              else
                echo "  [OK]      $(grep "^${s}=" "$HOSTCFG")"
              fi
            done
          fi
          # ──────────────────────────────────────────────────────────────

          make defconfig-drm

          # [VERIFY] defconfig 결과에 i915/DRM 활성 여부 (epyc 와 동일해야 정상)
          echo "=== CPTCFG_DRM* after defconfig-drm ==="
          grep -E "^CPTCFG_(DRM|DRM_I915|INTEL_GTT|DRM_KMS_HELPER|DRM_MIPI_DSI)=" .config \
            || echo "[WARN] CPTCFG_DRM* not enabled — i915 will be skipped"

          make -j$(nproc) modules_copy
          mkdir -p out/modules
          cp -vf .config out/modules/
    
      - name: Pack modules and config
        working-directory: out
        run: zip -r i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Append tag to filename
        working-directory: artifacts
        run: |
          find . -name "i915_dsm-*.zip" -print0 | while read -d $'\0' f; do
            mv "$f" "${f%.zip}_${GITHUB_REF##*/}.zip"
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: versions
          files: artifacts/**/i915_dsm-*.zip
