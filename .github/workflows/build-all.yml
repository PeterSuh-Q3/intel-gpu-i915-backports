name: Build i915 for DSM Platforms

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - "*-dsm-*"

jobs:
  build:
    strategy:
      matrix:
        version: [7.3]
        platform: [epyc7002, geminilakenk, r1000nk, v1000nk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          make defconfig-drm

          grep -E \
            "CPTCFG_BUILD_DMABUF_I915_MEI|CPTCFG_SYNC_FILE|CPTCFG_SW_SYNC|\
          CPTCFG_DMABUF_MOVE_NOTIFY|CPTCFG_DMABUF_HEAPS|\
          CPTCFG_DRM\b|CPTCFG_DRM_BUDDY|CPTCFG_DRM_DISPLAY_HELPER|\
          CPTCFG_DRM_KMS_HELPER|CPTCFG_DRM_MIPI_DSI|\
          CPTCFG_DRM_PANEL_ORIENTATION_QUIRKS|\
          CPTCFG_I915_COMPAT|CPTCFG_DRM_I915|CPTCFG_INTEL_GTT" \
            .config
  
          sed -i 's/# CPTCFG_DRM is not set/CPTCFG_DRM=m/' .config
          sed -i 's/# CPTCFG_DRM_I915 is not set/CPTCFG_DRM_I915=m/' .config
          sed -i 's/# CPTCFG_DRM_KMS_HELPER is not set/CPTCFG_DRM_KMS_HELPER=m/' .config
          sed -i 's/# CPTCFG_DRM_BUDDY is not set/CPTCFG_DRM_BUDDY=m/' .config
          sed -i 's/# CPTCFG_DRM_DISPLAY_HELPER is not set/CPTCFG_DRM_DISPLAY_HELPER=m/' .config
          sed -i 's/# CPTCFG_DRM_MIPI_DSI is not set/CPTCFG_DRM_MIPI_DSI=m/' .config
          sed -i 's/# CPTCFG_DRM_PANEL_ORIENTATION_QUIRKS is not set/CPTCFG_DRM_PANEL_ORIENTATION_QUIRKS=m/' .config
          sed -i 's/# CPTCFG_INTEL_GTT is not set/CPTCFG_INTEL_GTT=m/' .config          

          make -j$(nproc) modules_copy
          mkdir -p out/modules
          cp -vf .config out/modules/

      - name: Pack modules and config
        working-directory: out
        run: zip -r i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Append tag to filename
        working-directory: artifacts
        run: |
          find . -name "i915_dsm-*.zip" -print0 | while read -d $'\0' f; do
            mv "$f" "${f%.zip}_${GITHUB_REF##*/}.zip"
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: versions
          files: artifacts/**/i915_dsm-*.zip
