name: Build i915 for DSM Platforms

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - "*-dsm-*"

jobs:
  build:
    strategy:
      matrix:
        version: [7.3]
        platform: [epyc7002, geminilakenk, r1000nk, v1000nk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      # ── [DEBUG] 커널 .config 에서 DRM 관련 심볼 확인 ──────────────────
      - name: "[DEBUG] Host kernel CONFIG_DRM check"
        run: |
          KCONFIG=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build/.config
          echo "=== Host kernel config path ==="
          ls -la "$KCONFIG" || echo "[WARN] .config not found at expected path"

          echo ""
          echo "=== DRM-related symbols in host kernel ==="
          if [[ -f "$KCONFIG" ]]; then
            grep -E "CONFIG_DRM|CONFIG_AGP|CONFIG_FB" "$KCONFIG" || echo "[INFO] No DRM symbols found"
          fi

      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-

          make defconfig-drm

          # ── [DEBUG] defconfig 직후 .config 상태 스냅샷 ──────────────
          echo "=== [DEBUG] .config after make defconfig-drm (DRM/I915 items) ==="
          grep -E "CPTCFG_DRM|CPTCFG_I915|CPTCFG_INTEL" .config || echo "[INFO] No DRM CPTCFG found"

          # ── patch_config.sh 실행 ──────────────────────────────────────
          bash patch_config.sh

          # ── [DEBUG] 패치 직후 .config 상태 스냅샷 ───────────────────
          echo ""
          echo "=== [DEBUG] .config after patch_config.sh (DRM/I915 items) ==="
          grep -E "CPTCFG_DRM|CPTCFG_I915|CPTCFG_INTEL" .config || echo "[INFO] No DRM CPTCFG found"

          make -j$(nproc) modules_copy

          # ── [DEBUG] 빌드 결과 .ko 목록 확인 ─────────────────────────
          echo ""
          echo "=== [DEBUG] Built .ko files ==="
          find . -name "*.ko" | grep -v "\.tmp_" | sort

          mkdir -p out/modules
          cp -vf .config out/modules/

      - name: Pack modules and config
        working-directory: out
        run: zip -r i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip modules

      - name: Save to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915_dsm-${{ matrix.version }}_${{ matrix.platform }}
          path: out/i915_dsm-${{ matrix.version }}_${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Append tag to filename
        working-directory: artifacts
        run: |
          find . -name "i915_dsm-*.zip" -print0 | while read -d $'\0' f; do
            mv "$f" "${f%.zip}_${GITHUB_REF##*/}.zip"
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: versions
          files: artifacts/**/i915_dsm-*.zip
