name: "[PILOT-MT65] r1000nk i915 (hdmi compat 편입 검증)"
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: mainline-tracking-v6.5, fetch-depth: 1 }
      - name: Download toolchain+kernel
        run: |
          for t in env dev; do
            f=ds.r1000nk-7.3.$t.txz
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/7.3/r1000nk/$f
          done
          mkdir toolchain ksrc
          tar xf ds.r1000nk-7.3.env.txz -C toolchain
          tar xf ds.r1000nk-7.3.dev.txz -C ksrc
      - name: Build
        run: |
          export BACKPORT_DIR=$PWD
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-7.3/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1
          # r1000nk host config 의존심볼 주입(i915 가시화)
          HOSTCFG="$KLIB_BUILD/.config"
          for s in CONFIG_I2C CONFIG_I2C_ALGOBIT CONFIG_DMA_SHARED_BUFFER CONFIG_FB_CMDLINE CONFIG_INTERVAL_TREE CONFIG_RELAY CONFIG_SHMEM CONFIG_TMPFS CONFIG_IRQ_WORK CONFIG_HAS_DMA; do
            grep -q "^# ${s} is not set" "$HOSTCFG" && sed -i "s/^# ${s} is not set/${s}=y/" "$HOSTCFG" || ( grep -q "^${s}=" "$HOSTCFG" || echo "${s}=y" >> "$HOSTCFG" )
          done
          echo "=== host CONFIG_HDMI 상태 ==="; grep -E "^CONFIG_HDMI|^# CONFIG_HDMI" "$HOSTCFG" || echo "(CONFIG_HDMI 부재 → hdmi_5_10.o 편입 기대)"
          make defconfig-drm
          # 헤드리스(r1000nk/v1000nk): backlight + acpi_video 의존 제거(RR 방식).
          # IS_ENABLED 가드는 autoconf.h 의 #define 으로 결정 → backport+host autoconf 에서 직접 제거.
          # (gcc 는 -include 를 -U 뒤에 처리하므로 KCPPFLAGS -U 는 무효 → autoconf 직접 편집)
          echo "[OFF] backlight/acpi_video autoconf 매크로 제거"
          for AC in backport-include/backport/autoconf.h "$KLIB_BUILD/include/generated/autoconf.h"; do
            if [ -f "$AC" ]; then
              b=$(grep -cE "CONFIG_(BACKLIGHT_CLASS_DEVICE|ACPI_VIDEO)" "$AC")
              sed -i -E '/#define CONFIG_(BACKLIGHT_CLASS_DEVICE|ACPI_VIDEO)(_MODULE)? /d' "$AC"
              a=$(grep -cE "CONFIG_(BACKLIGHT_CLASS_DEVICE|ACPI_VIDEO)" "$AC")
              echo "  $AC : $b → $a"
            fi
          done
          for f in "$KLIB_BUILD/.config" "$KLIB_BUILD/include/config/auto.conf"; do
            [ -f "$f" ] && sed -i -E '/^CONFIG_(BACKLIGHT_CLASS_DEVICE|ACPI_VIDEO)(=|_MODULE=)/d' "$f"
          done
          # olddefconfig 생략(autoconf 직접 수정 보존). make 가 재생성하지 않도록 autoconf 를 최신 타임스탬프로.
          touch backport-include/backport/autoconf.h 2>/dev/null || true
          make -j$(nproc)
          mkdir -p out/modules
          make -C $KLIB_BUILD M=$PWD INSTALL_MOD_PATH=$PWD/out/im CONFIG_MODULE_SIG_ALL= _emodinst_
          find $PWD/out/im -name '*.ko' -exec mv {} out/modules \;
          echo "=== 산출 .ko ==="; ls -1 out/modules/*.ko | xargs -n1 basename
          echo "=== i915-compat.ko 가 hdmi_infoframe 자체 export 하는가 ==="
          nm out/modules/i915-compat.ko 2>/dev/null | grep -E "__ksymtab_hdmi_(avi_infoframe_init|infoframe_pack|drm_infoframe_init)" && echo "[OK] i915-compat 가 hdmi 자체제공 → hdmi.ko 불필요" || echo "[FAIL] hdmi 미포함"
          echo "=== ★ i915.ko 외부의존 전수 점검 (커널 Module.symvers / 산출 .ko 대조) ==="
          SYMV="$KLIB_BUILD/Module.symvers"
          # 커널이 제공(빌트인/stock모듈)하는 심볼 + 출처
          awk '{print $2}' "$SYMV" 2>/dev/null | sort -u > /tmp/kern.txt
          # backport 산출 .ko 가 export 하는 심볼
          for ko in out/modules/*.ko; do nm "$ko" 2>/dev/null | grep -oE '__ksymtab_[A-Za-z0-9_]+' | sed 's/__ksymtab_//'; done | sort -u > /tmp/prov.txt
          # i915.ko 의 undefined 심볼
          nm out/modules/i915.ko 2>/dev/null | awk '$1=="U"{print $2}' | sort -u > /tmp/i915u.txt
          echo "--- (A) 커널(stock/빌트인)이 제공 → 선적재로 해결 가능한 i915 외부의존 + 출처모듈 ---"
          comm -23 <(comm -23 /tmp/i915u.txt /tmp/prov.txt) <(cat /dev/null) | while read s; do
            src=$(awk -v x="$s" '$2==x{print $3; exit}' "$SYMV")
            [ -n "$src" ] && echo "  $s  <=  $src"
          done | grep -vE "<=  vmlinux$" | sort -u
          echo "--- (B) ★ 어디서도 제공 안 됨 (커널+산출 모두 없음 → 추가 조치 필요) ---"
          comm -23 /tmp/i915u.txt <(cat /tmp/kern.txt /tmp/prov.txt | sort -u)
          echo "--- (C) i915 외부의존 중 vmlinux 빌트인(자동 해결) 개수: $(comm -12 /tmp/i915u.txt /tmp/kern.txt | wc -l) ---"
